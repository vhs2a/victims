<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes "experimentations".</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:#eef2ff;
  background:#070814
}

body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 20%,rgba(116,82,255,.22),transparent 28%),
    radial-gradient(circle at 85% 70%,rgba(0,220,255,.15),transparent 30%),
    linear-gradient(135deg,#070814,#11142a 55%,#090b17)
}

body:before,
body:after{
  content:"";
  position:fixed;
  inset:-20%;
  z-index:-1;
  pointer-events:none;
  filter:blur(60px);
  animation:float 14s ease-in-out infinite alternate
}

body:before{
  background:radial-gradient(circle,rgba(143,92,255,.12),transparent 35%);
  transform:translate(-10%,-5%)
}

body:after{
  background:radial-gradient(circle,rgba(0,200,255,.1),transparent 35%);
  transform:translate(10%,10%);
  animation-delay:-7s
}

@keyframes float{
  to{transform:translate(8%,5%) scale(1.08)}
}

.wrap{
  width:min(1050px,92vw);
  margin:auto;
  padding:70px 0
}

.hero{
  text-align:center;
  margin-bottom:42px
}

.eyebrow{
  letter-spacing:.25em;
  text-transform:uppercase;
  color:#9da7c9;
  font-size:12px
}

h1{
  font-size:clamp(38px,7vw,76px);
  margin:12px 0;
  background:linear-gradient(90deg,#fff,#b9bfff,#8beaff);
  -webkit-background-clip:text;
  color:transparent
}

.hero p{
  color:#aeb6d2;
  max-width:760px;
  margin:10px auto;
  line-height:1.7
}

.grid{
  display:grid;
  gap:18px
}

.card{
  padding:22px;
  border:1px solid rgba(255,255,255,.11);
  background:rgba(17,20,42,.58);
  backdrop-filter:blur(18px);
  border-radius:22px;
  box-shadow:0 18px 60px rgba(0,0,0,.25);
  transition:.25s
}

.card:hover{
  transform:translateY(-3px);
  border-color:rgba(150,180,255,.3)
}

.row{
  display:flex;
  align-items:center;
  gap:16px
}

.play{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#101225;
  font-size:18px;
  cursor:pointer
}

.meta{
  min-width:0;
  flex:1
}

.title{
  font-size:20px;
  font-weight:750
}

.desc{
  color:#9da7c9;
  margin-top:5px
}

.wave{
  height:56px;
  margin-top:18px;
  display:flex;
  gap:3px;

.bar{

  opacity:.7;
  animation:pulse 1.6s ease-in-out infinite alternate
}

.bar:nth-child(3n){
  animation-delay:-.6s
}

.bar:nth-child(4n){
  animation-delay:-1s
}

@keyframes pulse{
  to{height:65%}
}

.empty{
  text-align:center;
  color:#9da7c9;
  padding:55px
}

.admin{
  position:fixed;
  right:18px;
  bottom:18px;
  padding:10px 14px;
  border-radius:999px;
  text-decoration:none;
  color:#dfe7ff;
  background:rgba(20,24,48,.75);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(12px);
  font-size:13px
}

@media(max-width:600px){
  .wrap{padding:45px 0}
  .card{padding:17px}
}
</style>
</head>

<body>

<!-- Background music -->
<audio id="bgMusic" autoplay loop preload="auto">
  <source src="audio/music.mp3" type="audio/mpeg">
</audio>

<main class="wrap">

<section class="hero">
  <div class="eyebrow">audio archive</div>

  <h1 id="title">
    Mes "experimentations".
  </h1>

  <p id="description"></p>
  <p id="explanation"></p>
</section>

<section id="list" class="grid"></section>

</main>

<a class="admin" id="adminLink" href="#" rel="noopener">
  Administration
</a>

<script>

/* ─────────────────────────────────────────────
   BACKGROUND MUSIC
   ───────────────────────────────────────────── */

const music = document.getElementById("bgMusic");

music.volume = 0.5;

window.addEventListener("load", () => {
  music.play().catch(() => {
    console.log("Autoplay blocked by browser.");
  });
});

document.addEventListener("click", () => {
  music.play().catch(() => {});
}, { once:true });




const audioExt = /\.(mp3|wav|ogg|oga|m4a|aac|flac|webm|opus)$/i;

let data = {};

const $ = s => document.querySelector(s);

function bars(){
  return Array.from(
    {length:72},
    (_,i) =>
      `<i class="bar" style="height:${12+Math.random()*72}%"></i>`
  ).join("");
}

function escapeHtml(s){
  return String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}

function card(item){

  const m =
    data.audios?.[item.path] ||
    data.audios?.[item.path.replace(/^audio\//,"")] ||
    {};

  const title =
    m.title ||
    item.name.replace(/\.[^.]+$/,"");

  const desc =
    m.description ||
    "";

  return `
    <article class="card">

      <div class="row">

        <button
          class="play"
          aria-label="Lire"
        >▶</button>

        <div class="meta">

          <div class="title">
            ${escapeHtml(title)}
          </div>

          <div class="desc">
            ${escapeHtml(desc)}
          </div>

        </div>

      </div>

      <div class="wave">
        ${bars()}
      </div>

      <audio
        preload="metadata"
        src="${item.url}"
      ></audio>

    </article>
  `;
}

async function getTree(path="audio"){

  const repo =
    location.pathname
      .split("/")
      .filter(Boolean)[0] || "";

  const owner =
    location.hostname.split(".")[0];

  const api =
    `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

  const r = await fetch(api);

  if(!r.ok)
    throw new Error("Impossible de lire le dépôt");

  const list = await r.json();

  let out = [];

  for(const x of list){

    if(x.type === "dir"){

      out = out.concat(
        await getTree(x.path)
      );

    }else if(audioExt.test(x.name)){

      out.push({
        path:x.path,
        name:x.name,
        url:x.download_url
      });

    }
  }

  return out;
}

async function init(){

  try{

    data =
      await fetch(
        "site-data.json?" + Date.now()
      ).then(r => r.json());

    $("#title").textContent =
      data.title ||
      "Mes experimentations";

    $("#description").textContent =
      data.description ||
      "";

    $("#explanation").textContent =
      data.explanation ||
      "";

    $("#adminLink").href =
      data.adminUrl ||
      "#";

    const files =
      await getTree();

    $("#list").innerHTML =
      files.length
        ? files.map(card).join("")
        : `<div class="card empty">
             Aucun audio pour le moment.
           </div>`;

    document
      .querySelectorAll(".card")
      .forEach(c => {

        const a = c.querySelector("audio");
        const b = c.querySelector(".play");

        b.onclick = () => {

          document
            .querySelectorAll(".card audio")
            .forEach(x => {
              if(x !== a)
                x.pause();
            });

          if(a.paused){

            a.play().catch(() => {});
            b.textContent = "Ⅱ";

          }else{

            a.pause();
            b.textContent = "▶";

          }

        };

        a.onended = () => {
          b.textContent = "▶";
        };

      });

  }catch(e){

    console.error(e);

    $("#list").innerHTML =
      `<div class="card empty">
        Impossible de charger les audios.
       </div>`;
  }
}

init();

</script>

</body>
</html>
